services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/graph-rag-local
    ports: ["7474:7474", "7687:7687"]
    volumes: ["graphdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graph-rag-local 'RETURN 1' >/dev/null 2>&1"]
      interval: 8s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports: ["8001:8000"]
    volumes: ["./uploads:/srv/uploads"]
    depends_on:
      neo4j: {condition: service_healthy}
volumes:
  graphdata:
